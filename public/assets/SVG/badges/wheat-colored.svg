  <!-- Grains de blé (droite) -->
  <ellipse cx="58" cy="30" rx="8" ry="12" fill="url(#wheatGradient)" stroke="#689F38" stroke-width="1.5"/>
  <ellipse cx="60" cy="45" rx="8" ry="12" fill="url(#wheatGradient)" stroke="#689F38" stroke-width="1.5"/>
  <ellipse cx="58" cy="60" rx="8" ry="12" fill="url(#wheatGradient)" stroke="#689F38" stroke-width="1.5"/>
